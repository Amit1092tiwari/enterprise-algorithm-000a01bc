name: Daily Database Health & Polyglot Benchmark Batch Job

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual on-demand execution from GitHub Actions UI

concurrency:
  group: "daily-batch"
  cancel-in-progress: false

jobs:
  # ====================================================================
  # JOB 1: MSSQL 2022 Container Full Regression Suite
  # ====================================================================
  mssql-engine-audit:
    name: MSSQL 2022 Full Regression & Health Audit
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "ArchitectPassword123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ArchitectPassword123!' -Q 'SELECT 1' -C"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install SQL Server Client Tools (sqlcmd)
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: 1. Audit Database Tips & Tricks (Functions & Dynamic Procedures)
        run: |
          echo "Auditing Calendar Table Dimension..."
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Database Tips and Tricks/Calendar Table/FnReturnCalendarTable.sql"
          echo "Auditing Nanosecond Date Difference Engines..."
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Database Tips and Tricks/Subtracting Two Dates/FnDateDiffPartsChar.sql"
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Database Tips and Tricks/Subtracting Two Dates/FnDateDiffPartsTable.sql"
          echo "Auditing Dynamic SQL Hardened Pivot Stored Procedure..."
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Database Tips and Tricks/Pivoting Data/SpPivotData.sql"

      - name: 2. Audit Azure Cloud DDL Schemas
        run: |
          echo "Auditing ADF Metadata Schemas & Table Types..."
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Microsoft Azure/Data Factory Metadata Demo/Data Factory SQL DDL Scripts.sql"
          echo "Auditing Databricks Suppliers & Parts Schemas..."
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Microsoft Azure/Databricks Spark Hive Demo/SuppliersAndPartsDDL.sql"

      - name: 3. Audit Advanced SQL Puzzles DDL Provisioning
        run: |
          echo "Executing Puzzles DDL Provisioning Suite..."
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Advanced SQL Puzzles/Advanced SQL Puzzles DDL.sql"

      - name: 4. Execute Advanced SQL Puzzles Multi-Strategy Solutions
        run: |
          echo "Executing 55 Advanced SQL Puzzles Solutions..."
          sqlcmd -S localhost,1433 -U sa -P 'ArchitectPassword123!' -C -b -i "Advanced SQL Puzzles/Advanced SQL Puzzles Solutions.sql"

  # ====================================================================
  # JOB 2: Daily Multi-Dialect Benchmark Suite (DuckDB / Python)
  # ====================================================================
  polyglot-dialect-benchmark:
    name: Daily Multi-Dialect Benchmark (DuckDB)
    runs-on: ubuntu-latest
    needs: mssql-engine-audit

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Benchmark Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb

      - name: Run Multi-Dialect Benchmark Runner
        run: |
          python scripts/daily_benchmark.py
